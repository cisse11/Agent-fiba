<style>
/* Layout : appli de poche, onglets défilants en haut, une carte d'exercice au centre */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --fg:#141922; --muted:#5e6878; --line:#dde2ea;
  --accent:#d4561c; --accent-soft:#fbe7dc; --ok:#2f7d4f; --ok-soft:#e1f1e7; --ko:#b8322a; --ko-soft:#f8e1de;
  --info:#1f5fae; --info-soft:#e2ecf8; --board:#0f1a2b; --board-fg:#eef3fa;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e131b; --surface:#171e29; --fg:#e9eef5; --muted:#98a3b3; --line:#2a3443;
  --accent:#f0773d; --accent-soft:#3a2216; --ok:#5cc184; --ok-soft:#183324; --ko:#f07a70; --ko-soft:#3a1a17;
  --info:#7cb2ee; --info-soft:#16263b; --board:#070c14; --board-fg:#eef3fa; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e131b; --surface:#171e29; --fg:#e9eef5; --muted:#98a3b3; --line:#2a3443;
  --accent:#f0773d; --accent-soft:#3a2216; --ok:#5cc184; --ok-soft:#183324; --ko:#f07a70; --ko-soft:#3a1a17;
  --info:#7cb2ee; --info-soft:#16263b; --board:#070c14; --board-fg:#eef3fa; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.05;text-wrap:balance}
h1{font-size:clamp(32px,8vw,44px);font-weight:800;text-transform:uppercase}
h2{font-size:24px;font-weight:700;text-transform:uppercase}
h3{font-size:19px;font-weight:700}
p{margin:0}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted)} .note{font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:6px;overflow-x:auto;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding-block:8px}
.tabs button{font-family:var(--display);font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.03em;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:99px;padding:8px 14px;cursor:pointer;white-space:nowrap;flex:none}
.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.btn{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:17px;letter-spacing:.03em;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:11px 16px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.ok{background:var(--ok)} .btn.ko{background:var(--ko)} .btn.mid{background:var(--muted)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.bar{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chips button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:99px;padding:5px 11px;cursor:pointer;white-space:nowrap;flex:none}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.say{font:inherit;font-size:14px;font-weight:600;background:var(--info-soft);color:var(--info);border:1px solid var(--info);border-radius:99px;padding:6px 12px;cursor:pointer;flex:none}
.pill{display:inline-block;font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:99px;background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--accent-soft);color:var(--accent)}
ul.clean{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
/* Accueil */
.hero{background:var(--board);color:var(--board-fg);border-radius:14px;padding:18px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.hero .lv{font-family:var(--display);font-weight:800;font-size:46px;line-height:1;color:#ff8a4c}
.hero .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.streak{text-align:right}.streak b{font-family:var(--display);font-size:40px;line-height:1;display:block}
.goal{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;cursor:pointer;background:var(--surface);text-align:left;font:inherit;color:var(--fg)}
.goal b{font-family:var(--display);font-size:18px;text-transform:uppercase}
.goal.done{border-color:var(--ok);background:var(--ok-soft)}
.goal .bar i{background:var(--ok)}
/* Cartes */
.flash{min-height:230px;justify-content:center;align-items:center;text-align:center}
.flash .w{font-family:var(--display);font-weight:800;font-size:clamp(34px,9vw,52px);line-height:1.05}
.flash .tr{font-size:20px;font-weight:600}
.flash .ex{font-style:italic;color:var(--muted)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate .btn{font-size:15px;padding:12px 6px}
/* Quiz */
.q{font-size:18px;font-weight:600;line-height:1.4}
.opts{display:flex;flex-direction:column;gap:8px}
.opts button{text-align:left;font:inherit;font-size:16px;background:var(--bg);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:12px;cursor:pointer}
.opts button.right{background:var(--ok-soft);border-color:var(--ok)}
.opts button.wrong{background:var(--ko-soft);border-color:var(--ko)}
.expl{background:var(--info-soft);border-left:3px solid var(--info);border-radius:8px;padding:10px 12px}
.lesson{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center;cursor:pointer;background:var(--surface);text-align:left;font:inherit;color:var(--fg);width:100%}
.lesson b{font-family:var(--display);font-size:18px}
.dots{display:inline-flex;gap:4px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--line);display:block}.dots i.on{background:var(--ok)}
/* Phrases */
.ph{border-top:1px solid var(--line);padding-top:10px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.ph:first-of-type{border-top:none;padding-top:0}
.ph .en{font-weight:600}
.ph .fr{font-size:14px;color:var(--muted)}
.hid{filter:blur(6px);cursor:pointer;user-select:none}
/* Dictée */
input[type=text],textarea{width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}
textarea{min-height:90px;resize:vertical}
.diff span{padding:0 2px;border-radius:4px}
.diff .okw{background:var(--ok-soft);color:var(--ok)} .diff .kow{background:var(--ko-soft);color:var(--ko);text-decoration:line-through}
.diff .miss{background:var(--accent-soft);color:var(--accent)}
/* Chat */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 12px;border-radius:12px;display:flex;flex-direction:column;gap:6px}
.msg.me{align-self:flex-end;background:var(--accent-soft);border:1px solid var(--accent)}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line)}
.fb{font-size:13px;background:var(--info-soft);border-radius:8px;padding:8px 10px}
.prompt{font-family:var(--mono);font-size:12px;white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;max-height:220px;overflow:auto}
.term{display:flex;justify-content:space-between;gap:10px;align-items:center;border-top:1px solid var(--line);padding-top:8px}
.term:first-of-type{border-top:none;padding-top:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const GRAMMAR=[
 {id:"g1",t:"you / your / yours",why:"Ton erreur au test : « you guard of you teams ».",
  body:`<p><b>you</b> = tu, vous (pronom). <b>your</b> = ton, ta, tes, votre, vos (devant un nom). <b>yours</b> = le tien, le vôtre (seul, sans nom).</p>
  <ul class="clean"><li><b>You</b> are the general manager.</li><li>Donovan is <b>your</b> guard.</li><li>This decision is <b>yours</b>.</li></ul>
  <p>Même logique : my / mine, his, her / hers, our / ours, their / theirs.</p>`,
  q:[["Donovan Mitchell is ___ best player.",["you","your","yours"],1],["Are ___ available on Monday?",["you","your","yours"],0],["The final decision is ___.",["your","you","yours"],2],["Thank you for ___ time.",["you","your","yours"],1],["I will send ___ the contract tomorrow.",["your","you","yours"],1]]},
 {id:"g2",t:"L'ordre des mots : l'adjectif avant le nom",why:"Ton erreur : « an agent FIBA ».",
  body:`<p>En anglais, ce qui décrit le nom se place <b>avant</b> lui. On dit l'inverse du français.</p>
  <ul class="clean"><li>un agent FIBA → a <b>FIBA agent</b></li><li>un contrat de deux ans → a <b>two-year contract</b> (pas de « s » à year)</li><li>un jeune meneur français → a <b>young French point guard</b></li><li>une offre de l'EuroLeague → a <b>EuroLeague offer</b></li></ul>`,
  q:[["Choose the correct sentence:",["I am an agent FIBA.","I am a FIBA agent.","I am agent of FIBA."],1],["He signed a ___.",["contract of three years","three-years contract","three-year contract"],2],["She is a ___.",["guard young","young guard","guard who young"],1],["We received an ___.",["offer EuroLeague","EuroLeague offer","offer of EuroLeague club"],1],["It's a ___ meeting.",["two-hour","two-hours","hours two"],0]]},
 {id:"g3",t:"I work ou I'm working ?",why:"Ton erreur : « I am working to the office ».",
  body:`<p><b>Présent simple</b> (I work) : une habitude, ton métier, un fait général.<br><b>Présent continu</b> (I'm working) : en ce moment précis, ou un projet temporaire.</p>
  <ul class="clean"><li>I <b>work</b> in accounting. (mon métier)</li><li>I<b>'m working</b> on a contract right now. (en ce moment)</li><li>He <b>plays</b> for Cleveland. / He<b>'s playing</b> very well this season.</li></ul>
  <p>Avec he / she / it au présent simple : ajoute <b>-s</b> (he works, she plays).</p>`,
  q:[["What do you do? — I ___ in an office.",["work","am working","works"],0],["Sorry, I can't talk, I ___ a meeting right now.",["have","am having","has"],1],["He ___ for the Cavaliers.",["play","plays","playing"],1],["This season, he ___ better than ever.",["plays","is playing","play"],1],["She usually ___ the train to work.",["takes","is taking","take"],0]]},
 {id:"g4",t:"Prépositions : in, at, on",why:"Tes erreurs : « to the office », « available the 12.20 ».",
  body:`<p><b>Temps</b> : <b>at</b> + heure (at 8 pm) · <b>on</b> + jour ou date (on Monday, on December 20) · <b>in</b> + mois, année, saison (in July, in 2027, in the summer).</p>
  <p><b>Lieu</b> : <b>in</b> + un espace (in Lausanne, in an office, in Spain) · <b>at</b> + un point précis (at the arena, at the airport, at work) · <b>for</b> + l'employeur (I work for a bank, he plays for Boston).</p>
  <p>Dates en anglais américain : <b>December 20, 2026</b> ou 12/20/2026 (mois d'abord).</p>`,
  q:[["Are you available ___ December 20?",["in","on","at"],1],["The game starts ___ 7:30.",["at","on","in"],0],["I live ___ Lausanne.",["at","on","in"],2],["He plays ___ the Cleveland Cavaliers.",["for","at","in"],0],["His contract ends ___ June.",["on","in","at"],1],["I work ___ an office.",["to","in","on"],1]]},
 {id:"g5",t:"because, so, but : toujours une phrase complète",why:"Ton erreur : « because. Want to build… »",
  body:`<p>Après <b>because</b> (parce que), <b>so</b> (donc), <b>but</b> (mais), il faut un <b>sujet + verbe</b>. En anglais, le sujet ne disparaît jamais.</p>
  <ul class="clean"><li>I want to be a FIBA agent <b>because I</b> love basketball.</li><li>He is injured, <b>so he</b> can't play.</li><li>The offer is good, <b>but it</b> is not guaranteed.</li></ul>
  <p>Pour donner une raison avec un nom : <b>because of</b> (because of his injury).</p>`,
  q:[["I want to be an agent because ___ to help young players.",["want","I want","wanting"],1],["He missed the game ___ his injury.",["because","because of","so"],1],["It's raining, ___ the game is cancelled.",["so","because","but"],0],["The salary is high, ___ there is no bonus.",["so","but","because"],1],["Choose the correct sentence:",["Is a good offer.","It is a good offer.","Good offer is."],1]]},
 {id:"g6",t:"Present perfect : for et since",why:"Niveau B1 que tu maîtrises : à consolider pour l'oral.",
  body:`<p><b>have / has + participe passé</b> pour une action commencée dans le passé qui continue, ou une expérience.</p>

const INT=[1,3,7,14,30,60];
function queue(){

}

let gOpen=null,gi=0,gAns=false,gScore=0;
const gstat=(id,k)=>(S.gq[id+"_"+k]||0);
function gMastered(L){return L.q.filter((_,k)=>gstat(L.id,k)>=2).length}
R.grammar=()=>{
  if(gOpen===null){
    view.innerHTML=`<section><p class="muted">10 leçons choisies d'après tes erreurs au test. Une leçon est maîtrisée quand tu réussis chaque question deux fois de suite.</p>
      ${GRAMMAR.map((L,n)=>{const m=gMastered(L);return `<button class="lesson" data-l="${n}"><span style="min-width:0"><b>${n+1}. ${esc(L.t)}</b><br><span class="note">${esc(L.why)}</span></span><span class="dots">${L.q.map((_,k)=>`<i class="${gstat(L.id,k)>=2?"on":""}"></i>`).join("")}</span></button>`}).join("")}
    </section>`;
    view.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{gOpen=+b.dataset.l;gi=-1;gScore=0;R.grammar()});return;
  }
  const L=GRAMMAR[gOpen];
  if(gi<0){
    view.innerHTML=`<section><button class="btn ghost" id="back" style="align-self:flex-start">← Leçons</button>
      <div class="card"><span class="eyebrow">Leçon ${gOpen+1}</span><h2>${esc(L.t)}</h2><p class="note">${esc(L.why)}</p>${L.body}
      <button class="btn" id="start">Faire les ${L.q.length} questions</button></div></section>`;
    $("#back").onclick=()=>{gOpen=null;R.grammar()};$("#start").onclick=()=>{gi=0;gAns=false;R.grammar()};return;
  }
  if(gi>=L.q.length){
    view.innerHTML=`<section><div class="card"><span class="eyebrow">Résultat · ${esc(L.t)}</span><h2>${gScore} / ${L.q.length}</h2>
      <p>${gScore===L.q.length?"Parfait. Refais-la demain pour la maîtriser.":"Relis la règle et recommence."}</p>
      <div class="row"><button class="btn" id="again">Recommencer</button><button class="btn ghost" id="rule">Relire la règle</button><button class="btn ghost" id="back">Toutes les leçons</button></div></div></section>`;
    $("#again").onclick=()=>{gi=0;gScore=0;gAns=false;R.grammar()};$("#rule").onclick=()=>{gi=-1;R.grammar()};$("#back").onclick=()=>{gOpen=null;R.grammar()};return;
  }
  const [q,o,a]=L.q[gi];gAns=false;
  view.innerHTML=`<section><div class="row" style="justify-content:space-between"><button class="btn ghost" id="back">← Leçons</button><span class="note">${esc(L.t)} · ${gi+1}/${L.q.length}</span></div>
    <div class="card"><p class="q" lang="en">${esc(q)}</p>
    <div class="opts">${o.map((x,k)=>`<button data-k="${k}" lang="en">${esc(x)}</button>`).join("")}</div>
    <div id="after" hidden><div class="expl" id="ex"></div><div class="row" style="margin-top:10px"><button class="btn" id="next">Suivante →</button>${sayBtn(q.replace("___",o[a]),"🔊 Écouter la phrase")}</div></div></div></section>`;
  $("#back").onclick=()=>{gOpen=null;R.grammar()};
  view.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>{
    if(gAns)return;gAns=true;const k=+b.dataset.k;const ok=k===a;const key=L.id+"_"+gi;
    S.gq[key]=ok?(S.gq[key]||0)+1:0;if(ok)gScore++;else b.classList.add("wrong");
    view.querySelectorAll(".opts button")[a].classList.add("right");
    $("#ex").innerHTML=`<b>${ok?"✓ Correct":"✗ Pas tout à fait"}</b> · Bonne réponse : <b lang="en">${esc(o[a])}</b><br><span lang="en">${esc(q.replace("___",o[a]))}</span>`;
    $("#after").hidden=false;$("#next").onclick=()=>{gi++;R.grammar()};bump("quiz")});
};

/* ---------- Phrases ---------- */
R.phrases=()=>{
  view.innerHTML=`<section>
    <div class="row" style="justify-content:space-between"><p class="muted" style="flex:1;min-width:200px">Les phrases d'un agent, prêtes à l'emploi. Écoute, répète à voix haute, puis cache l'anglais pour t'entraîner.</p>
      <button class="btn ghost" id="hide">${S.phHide?"Montrer l'anglais":"Cacher l'anglais"}</button></div>
    ${PHRASES.map(G=>`<div class="card"><h3>${esc(G.g)}</h3>${G.l.map(([en,fr])=>`<div class="ph"><div style="min-width:0"><div class="en ${S.phHide?"hid":""}" lang="en">${esc(en)}</div><div class="fr">${esc(fr)}</div></div><div class="row" style="flex:none">${sayBtn(en)}${canSpeak?`<button class="say" data-say="${esc(en)}" data-slow="1">🐢</button>`:""}</div></div>`).join("")}</div>`).join("")}
  </section>`;
  $("#hide").onclick=()=>{S.phHide=!S.phHide;save();R.phrases()};
  view.querySelectorAll(".hid").forEach(e=>e.onclick=()=>e.classList.remove("hid"));
};

/* ---------- Dictée ---------- */
let di=null;
function norm(s){return s.toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9' ]/g," ").split(/\s+/).filter(Boolean)}
const NUM={"8":"eight","30":"thirty","10":"ten","2":"two","3":"three","5":"five"};
R.dict=()=>{
  const list=DICT.map((d,i)=>i).filter(i=>S.dlv==="all"||DICT[i][0]===S.dlv);
  if(di===null||!list.includes(di))di=list.find(i=>!S.dictDone[i])??list[0];
  const [lv,t]=DICT[di];const done=Object.keys(S.dictDone).length;
  view.innerHTML=`<section>
    <div class="chips">${["all","A2","B1","B2","C1"].map(k=>`<button data-lv="${k}" aria-pressed="${S.dlv===k}">${k==="all"?"Tous":k}</button>`).join("")}</div>
    <div class="card"><div class="row" style="justify-content:space-between"><span class="eyebrow">Dictée · ${lv}</span><span class="note">${done}/${DICT.length} réussies</span></div>
      ${canSpeak?`<div class="row"><button class="btn" data-say="${esc(t)}">▶ Écouter</button><button class="btn ghost" data-say="${esc(t)}" data-slow="1">▶ Lentement</button></div>`:`<p class="note">L'audio n'est pas disponible ici.</p>`}
      <p class="note">Écoute autant de fois que nécessaire, puis écris ce que tu entends. Les majuscules et la ponctuation ne comptent pas.</p>
      <input type="text" id="din" lang="en" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type what you hear…">
      <div class="row"><button class="btn" id="check">Vérifier</button><button class="btn ghost" id="skip">Phrase suivante</button></div>
      <div id="dres" hidden></div></div></section>`;
  view.querySelectorAll("[data-lv]").forEach(b=>b.onclick=()=>{S.dlv=b.dataset.lv;save();di=null;R.dict()});
  const nextD=()=>{const p=list.indexOf(di);di=list[(p+1)%list.length];R.dict()};
  $("#skip").onclick=nextD;
  $("#check").onclick=()=>{
    const want=norm(t),got=norm($("#din").value).map(w=>NUM[w]||w);
    let j=0;const out=[];let good=0;
    want.forEach(w=>{const k=got.indexOf(w,j);if(k>=0){for(let x=j;x<k;x++)out.push(`<span class="kow">${esc(got[x])}</span>`);out.push(`<span class="okw">${esc(w)}</span>`);good++;j=k+1}else out.push(`<span class="miss">${esc(w)}</span>`)});
    for(let x=j;x<got.length;x++)out.push(`<span class="kow">${esc(got[x])}</span>`);
    const pct=Math.round(good/want.length*100);
    if(pct>=90&&!S.dictDone[di])S.dictDone[di]=1;
    bump("dict");
    const r=$("#dres");r.hidden=false;r.innerHTML=`<div class="expl"><b>${pct===100?"✓ Parfait":pct>=90?"✓ Presque parfait":pct+" % des mots"}</b>
      <p class="diff" lang="en" style="margin-top:6px">${out.join(" ")}</p>
      <p class="note" style="margin-top:6px">Vert : juste · orange : mot manquant · rouge barré : mot en trop ou mal écrit.</p>
      <p lang="en" style="margin-top:6px"><b>${esc(t)}</b></p></div><button class="btn" id="nxt" style="margin-top:10px">Phrase suivante →</button>`;
    $("#nxt").onclick=nextD;
  };
  $("#din").addEventListener("keydown",e=>{if(e.key==="Enter")$("#check").click()});
};

/* ---------- Parler ---------- */
let sampleFn=null,sampleReady=false,scen=null,chat=[],busy=false;
(async()=>{try{if(window.claude&&window.claude.use){sampleFn=await window.claude.use("sample")}}catch(e){}sampleReady=true;if(S.tab==="talk")R.talk()})();
function voicePrompt(s){return `Let's practice English. ${s.role}
I am a French speaker at B1 level (comprehension) and A2+ when speaking. My goal is to become a FIBA basketball agent.
Rules:
- Speak only in English, with simple and clear sentences, at a natural speed.
- Keep each of your answers short (2 to 3 sentences) and always end with a question for me.
- After each of my answers, first give me a short correction in French of my main mistake (if there is one), with the correct English sentence. Then continue the role-play in English.
- Stop after about 10 exchanges and give me a summary in French: my 3 main mistakes and 5 useful words.
Start now.`}
R.talk=()=>{
  if(!scen){
    const live=!!sampleFn;
    view.innerHTML=`<section>
      <div class="card"><h3>Parler pour progresser à l'oral</h3>
      ${live?`<p>Choisis une situation. Claude joue le rôle, te répond en anglais et corrige tes erreurs en français. Pour parler au lieu d'écrire, touche le <b>micro</b> du clavier.</p>`
      :`<p>Le mieux pour l'oral : le <b>mode vocal</b> de l'application Claude. Tu parles, Claude te répond à voix haute. Choisis une situation, copie la consigne, colle-la dans une nouvelle conversation Claude, puis touche l'icône du mode vocal.</p>`}
      </div>
      ${SCENARIOS.map((s,n)=>`<div class="card"><h3>${esc(s.t)}</h3><p class="note">${esc(s.fr)}</p>
        <div class="row">${live?`<button class="btn" data-s="${n}">Commencer</button>`:""}<button class="btn ${live?"ghost":""}" data-c="${n}">Copier la consigne pour le mode vocal</button></div>
        <pre class="prompt" id="p${n}" hidden>${esc(voicePrompt(s))}</pre><p class="note" id="c${n}" hidden>Copié. Colle-le dans une nouvelle conversation Claude, puis passe en mode vocal.</p></div>`).join("")}
      <p class="note">Une conversation compte pour l'objectif « Parler ou TV » du jour.</p>
    </section>`;
    view.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{scen=SCENARIOS[+b.dataset.s];chat=[];R.talk();sendAI(null)});
    view.querySelectorAll("[data-c]").forEach(b=>b.onclick=async()=>{const n=b.dataset.c;const t=voicePrompt(SCENARIOS[n]);
      try{await navigator.clipboard.writeText(t);$("#c"+n).hidden=false}catch(e){const p=$("#p"+n);p.hidden=false;$("#c"+n).hidden=false;$("#c"+n).textContent="Sélectionne le texte ci-dessus et copie-le.";}
      if(!S.day.talkCopied){S.day.talkCopied=true;bump("talk")}});
    return;
  }
  view.innerHTML=`<section><div class="row" style="justify-content:space-between"><button class="btn ghost" id="back">← Situations</button><span class="note">${esc(scen.t)}</span></div>
    <div class="chat" id="chat">${chat.map(m=>m.role==="me"?`<div class="msg me" lang="en">${esc(m.text)}</div>`:
      `<div class="msg ai"><span lang="en">${esc(m.text)}</span>${m.fb?`<div class="fb">${esc(m.fb)}${m.better?`<br><b lang="en">${esc(m.better)}</b>`:""}</div>`:""}<div class="row">${sayBtn(m.text,"🔊 Écouter")}</div></div>`).join("")}
      ${busy?`<div class="msg ai"><span class="note">Claude écrit…</span></div>`:""}</div>
    <div class="card"><textarea id="tin" lang="en" placeholder="Answer in English… (micro du clavier pour parler)"></textarea>
      <div class="row"><button class="btn" id="send" ${busy?"disabled":""}>Envoyer</button><button class="btn ghost" id="end">Terminer et voir mon bilan</button></div><p class="note" id="terr" hidden></p></div></section>`;
  $("#back").onclick=()=>{scen=null;R.talk()};
  $("#send").onclick=()=>{const v=$("#tin").value.trim();if(!v||busy)return;chat.push({role:"me",text:v});sendAI(null)};
  $("#end").onclick=()=>{if(busy)return;sendAI("end")};
  const c=$("#chat");if(c&&chat.length)c.lastElementChild&&c.lastElementChild.scrollIntoView({block:"nearest"});
};
async function sendAI(mode){
  busy=true;R.talk();
  const transcript=chat.map(m=>(m.role==="me"?"LEARNER: ":"YOU: ")+m.text).join("\n");
  const prompt=`Role-play for English practice. ${scen.role}
The learner is a French speaker (B1 comprehension, A2+ speaking) who wants to become a FIBA basketball agent.
Conversation so far:
${transcript||"(no messages yet — start the conversation)"}

${mode==="end"?`The learner wants to stop. Reply with only this JSON: {"reply":"a short goodbye in English","feedback":"bilan en français : ses 3 erreurs principales avec la correction, puis 5 mots utiles en anglais avec leur traduction","better":""}`
:`Reply with only this JSON: {"reply":"your next line in English, 1 to 3 simple sentences, ending with a question","feedback":"en français, une phrase : corrige l'erreur principale du dernier message de l'apprenant, ou dis 'Très bien !' s'il n'y a pas d'erreur. Vide si l'apprenant n'a encore rien dit.","better":"the learner's last message rewritten in natural English, or empty"}`}`;
  try{
    const a=await sampleFn.json(prompt,{modelTier:"quick",cache:false});
    chat.push({role:"ai",text:String(a.reply||""),fb:String(a.feedback||""),better:String(a.better||"")});
    if(chat.filter(m=>m.role==="me").length===1&&!S.day.talkChat){S.day.talkChat=true;bump("talk")}
  }catch(e){
    busy=false;R.talk();const t=$("#terr");if(t){t.hidden=false;t.textContent=e&&e.code==="not_granted"?"Claude n'a pas été autorisé. Utilise plutôt le mode vocal (bouton « Copier la consigne »).":e&&e.code==="rate_limited"?"Trop de messages pour le moment. Réessaie dans quelques minutes.":"Le message n'est pas passé. Réessaie."}
    return}
  busy=false;R.talk();
}

/* ---------- Méthode TV ---------- */
R.tv=()=>{
  view.innerHTML=`<section>
    <div class="card"><h3>Apprendre avec tes matchs NBA</h3>
      <p>Regarder passivement fait peu progresser. Ce qui marche : regarder <b>activement</b>, un peu chaque jour, et <b>répéter à voix haute</b>.</p>
      <ul class="clean">
        <li><b>Avant le match (2 min)</b> : révise 5 mots de l'onglet Mots, catégorie « Commentaires TV ».</li>
        <li><b>Pendant</b> : à chaque temps mort, répète à voix haute la dernière phrase du commentateur.</li>
        <li><b>Après (5 min)</b> : résume le match à voix haute en anglais, ou fais la mission du jour.</li>
        <li><b>Une fois par semaine</b> : une conférence de presse d'après-match sur YouTube. Les joueurs parlent lentement et avec des phrases simples. C'est parfait pour ton niveau.</li>
      </ul></div>
    <div class="card"><h3>Quoi regarder, du plus facile au plus difficile</h3>
      <ul class="clean">
        <li><b>Conférences de presse</b> d'après-match : phrases simples, débit lent.</li>
        <li><b>Résumés de match</b> (highlights) de 10 minutes avec commentaire.</li>
        <li><b>Matchs complets</b> sur ESPN, ABC, NBA TV, TNT.</li>
        <li><b>Émissions d'analyse</b> : NBA Today, Inside the NBA. Plus rapide, beaucoup d'opinions et d'humour.</li>
        <li><b>Débats</b> : First Take. Très rapide, niveau B2 et plus.</li>
      </ul>
      <p class="note">Si ton IPTV ou YouTube propose des sous-titres anglais, active-les : sous-titres en anglais, jamais en français.</p></div>
    <div class="card"><span class="eyebrow">Mission du jour</span><p>${TVMISSIONS[TODAY%TVMISSIONS.length]}</p>
      <button class="btn ghost" id="tvdone" style="align-self:flex-start">${S.day.tvDone?"✓ Mission faite":"J'ai fait la mission"}</button></div>
    <div class="card"><h3>Expressions des commentateurs</h3>
      ${TVTERMS.map(([en,fr])=>`<div class="term"><div style="min-width:0"><b lang="en">${esc(en)}</b><br><span class="note">${esc(fr)}</span></div>${sayBtn(en)}</div>`).join("")}</div>
  </section>`;
  $("#tvdone").onclick=()=>{if(!S.day.tvDone){S.day.tvDone=true;bump("talk")}R.tv()};
};

renderTabs();(R[S.tab]||R.today)();

</script>
